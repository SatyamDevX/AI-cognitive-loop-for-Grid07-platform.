[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grid07-ai-agent"
version = "0.1.0"
description = "Grid07 AI intern assignment implementation for cognitive routing and RAG."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
where = ["src"]
